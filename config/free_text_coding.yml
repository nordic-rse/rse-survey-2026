genAI6_0:
  header: GenAI skills
  text_column: genAI6_0
  embed_context: What skills do you think are necessary to effectively use generative AI for research
    software development tasks?
  embed_prefix: GenAI skill
  other: false
  cluster_method: kmeans
  k: 16
  model: intfloat/multilingual-e5-base
  random_state: 42
  label_model: Qwen/Qwen2.5-7B-Instruct
  label_load: 4bit
  n_examples: 25
  exclude_exact:
  - none
  - etc.
  - etc
  - i don't know
  - idk
  - no idea
  - desire for brain rot
  - lack of pride
  exclude_patterns:
  - (?i)brain\s*rot
  - (?i)^i don'?t know
  - (?i)^don'?t know$
  labels:
    0: Prompt Engineering
    1: Code Review
    2: Software Engineering Skills
    3: Software Development Skills
    4: AI Literacy
    5: Testing Skills
    6: AI Oversight Skills
    7: AI Ethics and Critical Thinking
    8: Skepticism
    9: Domain Knowledge
