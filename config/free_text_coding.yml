# HF free-text coding configs keyed by question_id.
# Text comes from the book-filtered survey table (text_column / question id).
# propose/apply update the labels: map under each key.

skill2:
  header: Skills
  text_column: skill2
  embed_context: What three skills would you like to acquire or improve to help your work as a Research
    Software Engineer / Research Software Developer? The skills can be technical and non-technical.
  other: false
  k: 15
  model: intfloat/multilingual-e5-base
  random_state: 42
  label_model: Qwen/Qwen2.5-7B-Instruct
  label_load: 4bit
  n_examples: 25
  labels:
    0: Research Software Management
    1: Coding And Development
    2: Soft Skills And Collaboration
    3: Advanced Development Techniques
    4: Requirements Engineering
    5: AI And Automation
    6: Software Testing
    7: Project Management
    8: Development Tools And Technologies
    9: Software Architecture And Design
    10: Teaching And Communication Skills
