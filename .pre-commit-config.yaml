# The ruff, mypy and uv hooks run the tool versions that uv.lock pins.
# The other hooks run the version in `rev`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        files: &package ^(src|tests|notebooks)/|^pyproject\.toml$
      - id: trailing-whitespace
        files: *package
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        files: *package
        # the recode rules match raw survey answers, typos included
        exclude: ^src/rse_survey_report/recode_maps\.py$

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
