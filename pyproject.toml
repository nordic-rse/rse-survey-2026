[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rse-survey"
version = "0.1.0"
description = "Modular analysis package for the International RSE Survey (Prefect + Quarto artifacts)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RSE Survey Team" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "plotnine>=0.13",
  "prefect>=2.14",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pre-commit>=3.5",
  "ruff>=0.4",
]
hf = [
  "sentence-transformers>=2.2",
  "scikit-learn>=1.3",
  "umap-learn>=0.5.7",
  "hdbscan>=0.8.33",
  # Python 3.12+ needs modern numba/llvmlite (umap → pynndescent pulls these)
  "numba>=0.60",
  "llvmlite>=0.43",
  "transformers>=4.36",
  "accelerate>=0.25",
  "tqdm>=4.66",
  "bitsandbytes>=0.41",
  "huggingface_hub>=0.20",
  "torch>=2.0",
]

[project.scripts]
rse-survey = "rse_survey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "hf: tests that need Hugging Face models or GPU",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
